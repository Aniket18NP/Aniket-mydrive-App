name: mydrive
description: "MyDrive Passenger Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # Google Maps
  google_maps_flutter: ^2.12.3

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Google Places & HTTP
  http: ^1.5.0

  # Route Polyline
  flutter_polyline_points: ^2.1.0

  # UUID
  uuid: ^4.5.1

  # Image Picker
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Cached Network Image
  cached_network_image: ^3.4.1

  # Local Notifications
  flutter_local_notifications: ^19.4.0

  # PDF & Sharing
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.1.0

  # URL Launcher
  url_launcher: ^6.3.2

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/